<style>
:root{--l:min(56vw,240px)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(circle at 50% 35%,#F4EFE6,#E4DAC4);font-family:Georgia,serif;color:#2F4A3E;text-align:center}
.escena{width:var(--l);height:var(--l);perspective:900px;margin-top:20px}
.cubo{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:gira 14s linear infinite}
.cara{position:absolute;inset:0;backface-visibility:hidden;box-shadow:0 0 0 1px #E2B65488 inset}
.cara svg{width:100%;height:100%;display:block}
.frente{transform:translateZ(calc(var(--l)/2))}
.atras{transform:rotateY(180deg) translateZ(calc(var(--l)/2))}
.derecha{transform:rotateY(90deg) translateZ(calc(var(--l)/2))}
.izquierda{transform:rotateY(-90deg) translateZ(calc(var(--l)/2))}
.arriba{transform:rotateX(90deg) translateZ(calc(var(--l)/2))}
.abajo{transform:rotateX(-90deg) translateZ(calc(var(--l)/2))}
@keyframes gira{0%{transform:rotateX(-24deg) rotateY(0)}50%{transform:rotateX(-34deg) rotateY(180deg)}100%{transform:rotateX(-24deg) rotateY(360deg)}}
.sombra{width:calc(var(--l)*.9);height:18px;margin-top:-6px;border-radius:50%;background:radial-gradient(#2F4A3E55,transparent 70%)}
h1{margin:0;font-size:clamp(24px,6vw,36px);letter-spacing:.06em}
p{margin:6px 0 0;font:600 12px/1.6 Inter,Helvetica,Arial,sans-serif;letter-spacing:.16em;color:#6E6457}
@media (prefers-reduced-motion:reduce){.cubo{animation:none;transform:rotateX(-24deg) rotateY(-35deg)}}
