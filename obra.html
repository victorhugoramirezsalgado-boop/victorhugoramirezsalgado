<div class="tema" role="group" aria-label="Tema"><button id="t1" aria-pressed="true">Beige</button><button id="t2" aria-pressed="false">Biblioteca</button></div></header>
<nav class="migas"><a class="nav" id="volver" href="./">‹ Volver a la biblioteca</a><span><a class="nav" id="prev">‹ Obra anterior</a> <a class="nav oro" id="next">Obra siguiente ›</a></span></nav>

<script>
let k=P.findIndex(p=>slugObra(p[1])===new URLSearchParams(location.search).get('id')); if(k<0)k=0;
document.title=`${P[k][1]} · Víctor Hugo Ramírez Salgado`;
document.getElementById('obra').innerHTML=htmlObra(k);
const otra=j=>`obra.html?id=${slugObra(P[(j+P.length)%P.length][1])}`;
document.getElementById('prev').href=otra(k-1);document.getElementById('next').href=otra(k+1);
document.getElementById('volver').href=`./#obra-${k+1}`;
const set=(t,g)=>{document.body.classList.toggle('biblioteca',t==='b');t1.setAttribute('aria-pressed',t!=='b');t2.setAttribute('aria-pressed',t==='b');if(g)try{localStorage.setItem('vhrs-tema2',t)}catch(e){}};
t1.onclick=()=>set('a',1);t2.onclick=()=>set('b',1);let tm='b';try{tm=localStorage.getItem('vhrs-tema2')||'b'}catch(e){}set(tm);
</script>
